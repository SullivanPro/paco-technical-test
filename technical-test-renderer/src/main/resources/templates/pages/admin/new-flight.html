<!DOCTYPE html>
<html lang="fr" layout:decorate="~{decorators/master}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Créer un Vol</title>

    <style>

        *, *::before, *::after {
          box-sizing: border-box; // includes padding and border*
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f7fc;
            margin: 0;
            padding: 0;
            color: #333;
        }

        section {
            padding: 40px;
            max-width: 600px;
            margin: auto;
        }

        h2 {
            color: #3498db;
            text-align: center;
            margin-bottom: 30px;
        }


        form {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ddd;
            max-width: 600px;
        }


        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        a.back {
            color: #3498db;
            text-decoration: none;
            padding-top: 12px;
        }
    </style>
</head>

<body>

<section layout:fragment="content">

    <h2>Créer un nouveau vol</h2>

    <form th:action="@{/admin}" th:object="${flight}" method="post">

        <label for="origin">Code IATA - Origine</label>
        <input id="origin" type="text" th:field="*{origin.iata}" placeholder="Ex: CDG" required>

        <label for="destination">Code IATA - Destination</label>
        <input id="destination" type="text" th:field="*{destination.iata}" placeholder="Ex: JFK" required>

        <label for="price">Prix (€)</label>
        <input id="price" type="number" min="0" step="0.01" th:field="*{price}" placeholder="Ex: 199.99" required>

        <label for="image">URL de l'image</label>
        <input id="image" type="url" th:field="*{image}" placeholder="https://..." required>

        <div class="actions">
            <a class="back" th:href="@{/}">← Retour</a>
            <button type="submit">Créer le vol</button>
        </div>

    </form>

</section>

</body>
</html>
